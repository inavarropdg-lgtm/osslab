/* ---------- Voting Session ---------- */
const VS_SECS=60;let vsTimer=null;
function vsStart(){const q=pendingClips().map(c=>c.id);S.vs={q,i:0,end:Date.now()+VS_SECS*1000,n:0,pts:0,done:false};S.rate={id:q[0],stars:0,chips:[],comment:''};vsTick();}
function vsTick(){clearInterval(vsTimer);vsTimer=setInterval(()=>{if(!S.vs||S.vs.done){clearInterval(vsTimer);return}const left=Math.max(0,S.vs.end-Date.now());const bar=document.getElementById('vs-bar'),lab=document.getElementById('vs-left');if(bar)bar.style.width=(left/(VS_SECS*10))+'%';if(lab)lab.textContent=Math.ceil(left/1000)+' s';if(left<=0){S.vs.done=true;clearInterval(vsTimer);save();render()}},250)}
function vsNext(){const v=S.vs;v.i++;if(v.i>=v.q.length){v.done=true;clearInterval(vsTimer)}else S.rate={id:v.q[v.i],stars:0,chips:[],comment:''};save();render();window.scrollTo(0,0)}
function vsView(){const v=S.vs;
if(v.done||!v.q.length){return `<div class="pad vsend"><button class="link tback" data-act="vs-close">${ic('ArrowLeft')} ${L('Técnica','Technique')}</button>
<div class="vsdone"><span class="pic t-orange">${ic('Star')}</span><h1 class="display sm">${v.q.length?L('Sesión terminada','Session finished'):L('Nada pendiente','Nothing pending')}</h1>
<p class="pr-s">${v.q.length?L(`Has valorado ${v.n} ${v.n===1?'clip':'clips'} y ganado ${v.pts} puntos de karma.`,`You rated ${v.n} ${v.n===1?'clip':'clips'} and earned ${v.pts} karma points.`):L('Ya has valorado todas las ejecuciones de la comunidad. Vuelve más tarde.','You have rated every community execution. Come back later.')}</p>
<p class="vsk">${ic('Zap')} ${soc().karma} <small>Tatami Karma</small></p>
${pendingClips().length?`<button class="cta" data-act="vs-start">${L('Otra sesión de 60 s','Another 60 s session')}</button>`:''}<button class="cta ghost" data-act="vs-close" style="margin-top:8px">${L('Volver a Técnica','Back to Technique')}</button></div></div>`}
const c=clipById(v.q[v.i]),t=techById(c.techId),left=Math.max(0,v.end-Date.now());
return `<div class="pad vs"><div class="vstop"><button class="link" data-act="vs-close">${ic('ArrowLeft')} ${L('Salir','Exit')}</button><span class="pill">${v.i+1}/${v.q.length}</span><span class="vsl" id="vs-left">${Math.ceil(left/1000)} s</span></div>
<div class="vstrack"><i id="vs-bar" style="width:${left/(VS_SECS*10)}%"></i></div>
<p class="tcat">${esc(T(TCAT[t.cat]))} · ${esc(T(t.n))}</p>
${clipPlayer(c)}
<p class="chs">${esc(c.author)}${c.belt?` · <i class="bd l-${c.belt}"></i>${esc(T(BELTS5[c.belt]))}`:''}</p>
<details class="vskeys"><summary>${L('Puntos clave para valorar','Key points to judge')}</summary><ol>${(S.lang==='en'&&t.k.en?t.k.en:t.k.es).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>
${ratePanel(c,'vs')}
<p class="pr-s vshint">${L('Elige estrellas y toca un chip: pasa solo al siguiente. +20 por voto.','Pick stars and tap a chip: it moves on by itself. +20 per vote.')}</p></div>`}

function karmaBadge(){return `<button class="kbadge" data-act="karma-open" aria-label="Karma ${soc().karma}">${ic('Zap')}<b>${soc().karma}</b></button>`}
function karmaSheet(){const s=soc();const lab={upload:L('Subiste una ejecución','You uploaded an execution'),vote:L('Valoraste a otro atleta','You rated another athlete'),del:L('Eliminaste una ejecución','You deleted an execution')};
return `<div class="modal" role="dialog" aria-modal="true" aria-label="Karma"><button class="mbg" data-act="karma-close" aria-label="${L('Cerrar','Close')}"></button><div class="sheet ksheet"><p class="vsk">${ic('Zap')} ${s.karma} <small>Tatami Karma</small></p>
<p class="pr-s">${L(`+${KARMA.upload} por subir una ejecución · +${KARMA.vote} por valorar a otro atleta. Ayudar vale el doble que subir.`,`+${KARMA.upload} for uploading an execution · +${KARMA.vote} for rating another athlete. Helping is worth twice uploading.`)}</p>
<p class="pg-h">${L('Actividad','Activity')}</p>${s.log.length?`<div class="pgroup">${s.log.slice(0,12).map(x=>`<div class="klog"><span>${esc(lab[x.t]||x.t)}${x.ref&&techById(x.ref)?` · ${esc(T(techById(x.ref).n))}`:''}</span><b class="${x.pts<0?'neg':''}">${x.pts>0?'+':''}${x.pts}</b></div>`).join('')}</div>`:`<p class="pr-s">${L('Aún no tienes puntos. Abre «Valorar clips» y valora tu primer clip.','No points yet. Open “Rate clips” and rate your first clip.')}</p>`}

/* ---------- actions ---------- */
function socAct(t,act,v){const rr=()=>{save();render();return true},s=soc();
switch(act){
case 'tec-pane':S.tecPane=v;S.rate=null;return rr();
case 'soc-belt':{const d=S.socDraft&&S.socDraft.t===S.tecOpen?S.socDraft:{t:S.tecOpen,url:'',belt:null};d.belt=d.belt===v?null:v;S.socDraft=d;return rr()}
case 'soc-pub':{const d=S.socDraft;if(!d||!d.consent)return true;const p=d.local?{ok:true,platform:'local',vid:d.local.id,url:''}:parseClip(d.url);if(!p.ok)return true;
 const dup=allClips().find(c=>c.techId===d.t&&c.vid===p.vid);if(dup){const m=document.getElementById('soc-msg');if(m){m.className='upmsg bad';m.textContent=L('Ese vídeo ya está publicado en esta técnica.','That video is already posted on this technique.')}return true}
 const id='me-'+Date.now().toString(36);s.clips.push({id,techId:d.t,url:p.url,platform:p.platform,vid:p.vid,belt:d.belt||null,author:L('Tú','You'),mine:true,at:iso(today()),ch:d.ch&&d.ch===challenge().id&&d.t===challenge().techId?d.ch:null});addKarma('upload',KARMA.upload,d.t);S.socDraft=null;save();render();const el=document.getElementById('clip-'+id);if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});return true}
case 'clip-del':{const i=s.clips.findIndex(c=>c.id===v&&c.mine);if(i>=0){const c=s.clips[i];if(c.platform==='local')idbDel(c.vid);s.clips.splice(i,1);delete s.votes[v];addKarma('del',-KARMA.upload,c.techId)}return rr()}
case 'rate-open':S.rate={id:v,stars:0,chips:[],comment:'',open:true};return rr();
case 'rate-cancel':S.rate=null;return rr();
case 'rate-star':{const c=t.dataset.c;if(!S.rate||S.rate.id!==c)S.rate={id:c,stars:0,chips:[],comment:'',open:true};S.rate.stars=+v;return rr()}
case 'rate-chip':{const r=S.rate;if(!r)return true;const k=r.chips.indexOf(v);if(k>=0)r.chips.splice(k,1);else r.chips.push(v);return rr()}
case 'rate-send':{const r=S.rate,c=clipById(v);if(!r||!r.stars||!c||c.mine||myVote(c))return true;const com=document.getElementById('rate-com');r.comment=(com&&com.value||r.comment||'').trim().slice(0,140);
 s.votes[c.id]=[Object.assign({by:'me',stars:r.stars,chips:r.chips.slice(),comment:r.comment,at:new Date().toISOString()},prof().isSuperCoach?{coach:true}:{})];addKarma('vote',KARMA.vote,c.techId);S.rate=null;return rr()}
case 'vs-start':S.tab='tec';S.tecOpen=null;S.play=null;S.karmaOpen=false;vsStart();save();render();window.scrollTo(0,0);return true;
case 'karma-vs':S.karmaOpen=false;S.tab='tec';S.tecOpen=null;vsStart();save();render();window.scrollTo(0,0);return true;
case 'vs-close':clearInterval(vsTimer);S.vs=null;S.rate=null;return rr();
case 'vs-skip':vsNext();return true;
case 'vs-chip':case 'vs-send':{const r=S.rate,c=r&&clipById(r.id);if(!r||!r.stars||!c)return true;const chips=act==='vs-chip'?[v]:[];
 s.votes[c.id]=[Object.assign({by:'me',stars:r.stars,chips,comment:'',at:new Date().toISOString()},prof().isSuperCoach?{coach:true}:{})];addKarma('vote',KARMA.vote,c.techId);S.vs.n++;S.vs.pts+=KARMA.vote;vsNext();return true}
case 'karma-open':S.karmaOpen=true;return rr();
case 'karma-close':S.karmaOpen=false;return rr();
}return false}
/* live URL validation without re-render (keeps focus) */
document.addEventListener('input',e=>{const t=e.target;if(!t)return;
if(t.id==='soc-url'){const d=S.socDraft&&S.socDraft.t===S.tecOpen?S.socDraft:{t:S.tecOpen,url:'',belt:null};d.url=t.value;S.socDraft=d;const p=parseClip(t.value),m=document.getElementById('soc-msg'),b=document.getElementById('soc-pub');
 if(p.ok&&d.local){idbDel(d.local.id);d.local=null}if(m){m.className='upmsg '+(p.ok?'ok':t.value?'bad':'');m.innerHTML=p.ok?`${ic('Check')} ${PLAT[p.platform]} ${L('detectado','detected')}`:esc(p.msg||'')}if(b)b.disabled=!((p.ok||d.local)&&d.consent);save()}
if(t.id==='rate-com'&&S.rate){S.rate.comment=t.value.slice(0,140)}});

 const end=new Date(w.sun.getFullYear(),w.sun.getMonth(),w.sun.getDate(),23,59,59);const left=Math.max(0,Math.ceil((end-Date.now())/864e5));return {id:'ch-'+w.key,techId,end,left,wn:curWeek()}}

const IDB_NAME='osslab-media',IDB_ST='clips';
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>{r.result.createObjectStore(IDB_ST)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbPut(id,blob){return idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_ST,'readwrite');tx.objectStore(IDB_ST).put(blob,id);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error)}))}
function idbGet(id){return idbOpen().then(db=>new Promise((res,rej)=>{const q=db.transaction(IDB_ST).objectStore(IDB_ST).get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)}))}
function idbDel(id){try{idbOpen().then(db=>{db.transaction(IDB_ST,'readwrite').objectStore(IDB_ST).delete(id)}).catch(()=>{})}catch(e){}}

const RT={end:0,id:null,next:''};let AC=null,WL=null;

function tickRT(){const el=$('#rest');if(!el)return;const ms=RT.end-Date.now();el.hidden=false;
if(ms<=0){el.querySelector('.rt').textContent=L('¡A por la siguiente!','Next one!');el.classList.add('go');if(RT.id){clearInterval(RT.id);RT.id=null}beep();try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}setTimeout(()=>{if(!RT.id){el.hidden=true;el.classList.remove('go')}},4000);return}
el.classList.remove('go');const s=Math.ceil(ms/1000);el.querySelector('.rt').textContent=`${Math.floor(s/60)}:${pad(s%60)}`;el.querySelector('.rn').textContent=RT.next}
function startRest(sec,next){if(!sec)return;try{const C=window.AudioContext||window.webkitAudioContext;if(C&&!AC)AC=new C();if(AC&&AC.state==='suspended')AC.resume()}catch(e){}RT.end=Date.now()+sec*1000;RT.next=next||'';if(RT.id)clearInterval(RT.id);RT.id=setInterval(tickRT,250);tickRT()}
function stopRest(){if(RT.id)clearInterval(RT.id);RT.id=null;const el=$('#rest');if(el){el.hidden=true;el.classList.remove('go')}}
async function wakeOn(){try{if('wakeLock' in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){WL=null}}

if(act==='toggle-ex'){const k=`${iso(today())}:${v}`;if(S.ex[k])delete S.ex[k];else S.ex[k]=true;save();render();return}
if(act==='ck'){const ds=iso(today());S.ck[ds]=Object.assign({},S.ck[ds],{[q]:v});if(readiness(S.ck[ds]))S.ckEdit=false;if(S.live&&!Object.values(S.live.sets).some(a=>(a||[]).some(x=>x&&x.done)))S.live=null;save();render();return}
if(act==='ckedit'){delete S.ck[iso(today())];S.ckEdit=false;if(S.live&&!Object.values(S.live.sets).some(a=>(a||[]).some(x=>x&&x.done)))S.live=null;save();render();return}
if(act==='force'){ensureLive(+v).force=true;save();render();return}
if(act==='set'){onSet(t);return}
if(act==='fin'){if(S.live){S.live.fin=true;save();render()}return}
if(act==='srpe'){if(S.live){S.live.srpe=+v;save();render()}return}
if(act==='save-ses'){saveSession(build());stopRest();wakeOff();save();render();window.scrollTo(0,0);return}
if(act==='sumclose'){S.lastSum=null;S.play=null;wakeOff();save();render();return}
if(act==='rest-add'){RT.end+=30000;if(!RT.id)RT.id=setInterval(tickRT,250);tickRT();return}
if(act==='rest-skip'){stopRest();return}
/* mat log */
if(act==='mf'){const k=t.dataset.k;if(k==='type'){S.mf.type=v;S.mf.rpe=MATR[v]}else S.mf[k]=+v;save();render();return}
if(act==='mat-save'){S.log.mat.push({date:iso(addD(today(),-S.mf.day)),type:S.mf.type,min:S.mf.min,rpe:S.mf.rpe});S.mfOk=true;S.example=false;save();render();return}
/* plan */
if(act==='pweek'){S.planWeek=+v;save();render();return}
if(act==='copy'){const b=build(),it=b.d.teach[+t.dataset.i];if(it){try{navigator.clipboard.writeText(T(it.q)).then(()=>{t.textContent=L('Copiada','Copied')},()=>{t.textContent=L('Error','Error')})}catch(err){t.textContent=L('Error','Error')}}return}
/* progress */
if(act==='fb'){const w=t.dataset.w,g=t.dataset.g;S.fb[w]=S.fb[w]||{g:{}};S.fb[w].g=S.fb[w].g||{};S.fb[w].g[g]=+v;const gs=Object.values(S.fb[w].g);S.fb[w].all=Math.round(gs.reduce((a,b)=>a+b,0)/gs.length);S.example=false;save();render();return}
/* vendors */
if(act==='vfilter'){S.vfilter=v;S.vsel=null;save();render();return}
if(act==='vpin'){S.vsel=+v;save();render();const el=$('#v-'+v);if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});return}
if(act==='switch-mode'){S.a.mode=(S.a.mode==='clases')?'parallel':'clases';if(S.a.audio==null)S.a.audio=true;S.cls={};S.clsLast=null;save();render();window.scrollTo(0,0);return}
if(act==='toggle-audio2'){S.a.audio=!(S.a.audio!==false);save();render();return}
if(act==='cls-topic'){S.cls=Object.assign({},S.cls,{topic:v});save();render();return}
if(act==='cls-rec'){S.cls=S.cls||{};S.cls.media=S.cls.media===v?null:v;save();render();return}
if(act==='cls-save'){const d=S.cls||{};if(!d.topic)return;S.log.mat.push({date:iso(today()),type:'tecnica',min:90,rpe:6,topic:d.topic,audio:!!d.media});if(d.media){S.uploads=(S.uploads||[]).concat({id:Date.now(),date:iso(today()),topic:d.topic,media:d.media,state:navigator.onLine===false?'pending':'uploading'});setTimeout(processUploads,1500)}S.clsLast={date:iso(today()),topic:d.topic};S.cls={};S.example=false;save();render();window.scrollTo(0,0);return}
if(act==='cls-again'){S.clsLast=null;S.cls={};save();render();return}
if(act==='start-trial'){S.trial={start:iso(today()),price:S.school?'6,99':'9,99'};save();render();return}
if(act==='remind-toggle'){S.remind=!(S.remind!==false);save();render();return}
if(act==='open-matlog'){S.open.matlog=true;save();render();const el=$('#matlog');if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'});return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const t=e.target.closest('.vpin');if(t){e.preventDefault();S.vsel=+t.dataset.v;save();render()}}});
document.addEventListener('toggle',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.acc){S.open[el.dataset.acc]=el.open;save()}},true);

/* ================= set logging ================= */
function onSet(t){
const sx=+t.dataset.sx,id=t.dataset.id,k=+t.dataset.i,live=ensureLive(sx),arr=live.sets[id]=live.sets[id]||[],cur=arr[k]||{};
if(cur.done){cur.done=false;arr[k]=cur;save();render();return}
const row=t.closest('.srow'),tr=+t.dataset.tr,o=Object.assign({},cur,{done:true,nm:t.dataset.nm,kind:t.dataset.kind,t:tr,lo:+t.dataset.lo,inc:+t.dataset.inc});
let bad=null;
if(row)for(const el of row.querySelectorAll('[data-lv]')){const f=el.dataset.lv,val=el.value===''?null:+el.value;if(val==null||isNaN(val)||val<=0){if(!bad)bad=el}else o[f]=val}
if(bad){bad.classList.add('err');bad.setAttribute('aria-invalid','true');bad.focus();return}
if(o.rpe==null&&tr>0)o.rpe=tr;
arr[k]=o;if(!live.start)live.start=Date.now();live.adv=true;
const pend=document.querySelectorAll('.player .srow.pv').length,pl=$('.player'),nxt=pl?pl.dataset.nextex:'';
startRest(+t.dataset.rest,pend?L(`Siguiente: serie ${k+2}`,`Next: set ${k+2}`):nxt?`${L('Siguiente','Next')}: ${nxt}`:L('Última serie: termina la sesión','Last set: finish the session'));
save();render();
const f=$('.player .tick.big')||$('.player .bigtick[aria-pressed="false"]')||$('[data-act="fin"]');if(f)f.focus({preventScroll:true})}

/* ================= inputs ================= */
function liveIn(t){const live=ensureLive(+t.dataset.sx),id=t.dataset.id,k=+t.dataset.i,arr=live.sets[id]=live.sets[id]||[];arr[k]=Object.assign({},arr[k],{[t.dataset.lv]:t.value===''?null:+t.value});t.classList.remove('err');save()}
document.addEventListener('input',e=>{const t=e.target,a=S.ob?S.ob.a:S.a;
if(t.dataset&&t.dataset.lv){liveIn(t);return}
if(t.id==='fin-min'){if(S.live)S.live.min=t.value===''?null:+t.value;save();return}
if(t.id==='q-cl'){a.classes=t.value===''?'':Math.round(+t.value);navOnly()}
else if(t.id==='q-age'){a.age=t.value===''?'':Math.round(+t.value);navOnly()}
else if(t.id==='q-wt'){a.weight=t.value===''?'':Math.round(+t.value*10)/10;navOnly()}
else if(t.id==='q-ht'){a.height=t.value===''?'':Math.round(+t.value);navOnly()}
else if(t.id==='q-wks'){a.weeksTo=t.value===''?'':Math.round(+t.value);navOnly()}
else if(t.dataset&&t.dataset.t){const id=t.dataset.t,i=+t.dataset.i,arr=(S.tests[id]||[null,null,null,null]).slice();arr[i]=t.value===''?null:+t.value;S.tests[id]=arr;S.example=false;save();
 const kp=kpisFor(S.goals).find(x=>x.id===id);if(kp){const tg=target(kp,arr[0]),pr=progress(kp,arr),g=$('#tg-'+id),m=$('#mt-'+id);if(g)g.textContent=tgText(kp,tg,pr);if(m)m.style.width=(pr==null?0:Math.round(pr*100))+'%'}}});
function navOnly(){if(S.ob&&S.ob.step==='survey'){const id=obStepList()[S.ob.si||0],ok=validQ(id),n=$('#obnext'),m=$('#miss');if(n)n.disabled=!ok;if(m)m.textContent=ok?'':missMsg(id)}save()}
document.addEventListener('change',e=>{const t=e.target,a=S.ob?S.ob.a:S.a;if(t.id==='q-spar'){a.spar=+t.value;navOnly()}else if(t.dataset&&t.dataset.act==='toggle-audio'){S.ob.a.audio=t.checked;save()}else if(t.dataset&&t.dataset.act==='school-net'){S.ob.school=t.checked;save();render()}else if(t.dataset&&t.dataset.act==='remind'){S.ob.remind=t.checked;save()}else if(t.dataset&&t.dataset.photo&&t.files&&t.files[0]){savePhoto(t.dataset.photo,t.files[0])}else if(t.dataset&&t.dataset.act==='pl-consent-tog'){S.plConsent=t.checked;save();render()}else if(t.dataset&&t.dataset.act==='school2'){S.school=t.checked;save();render()}});

/* ================= boot ================= */
function boot(data){
if(data&&data.S)Object.assign(S,data.S);else load();
if(!S.log||!S.log.mat)S.log={mat:[],ses:[]};if(!S.ck)S.ck={};if(!S.ex)S.ex={};if(!S.fb)S.fb={};if(!S.ms)S.ms={};if(!S.mf)S.mf={type:'tecnica',day:0,min:90,rpe:5};
if(!S.a){S.phaseApp=false;if(S.ob&&!S.ob.step)S.ob=null}
else if(S.example&&(S.log.seeded!==iso(today()))){reseedIfExample()}
if((S.uploads||[]).some(u=>u.state!=='done'))setTimeout(processUploads,1500);
render()}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S}));
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}

</script>
</body>
