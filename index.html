<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>osslab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1114);--ink:light-dark(#141414,#f2f2ee);--mut:light-dark(#5b5f66,#a3a8b0);--surf:light-dark(#f4f4f2,#181b20);--surf2:light-dark(#e9e9e5,#252931);--line:light-dark(#deded9,#2e323a);--acc:light-dark(#c2410c,#ff8a4c);--acc2:light-dark(#9a3412,#ffb08a);--accs:light-dark(#fde9dc,#3a2418);--onacc:light-dark(#ffffff,#141414);--teal:light-dark(#0f766e,#5fd4c8);--teals:light-dark(#dcf2ee,#14262a);--vio:light-dark(#5b3fb5,#b9a6ff);--vios:light-dark(#ece7fb,#241d3a);--amb:light-dark(#b45309,#fbbf24);--red:light-dark(#b91c1c,#f87171)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:'Space Grotesk',Inter,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,4.4vw,48px)}
h2{font-size:21px}
h3{font-size:17px}
p{margin:.4em 0}
a{color:var(--acc)}
a:hover{color:var(--acc2)}
button,input,select{font:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{background:#0f1114;color:#f2f2ee;border-bottom:1px solid #2e323a}
.top .in{max-width:1180px;margin:0 auto;padding:10px max(4vw,16px);display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-family:'Space Grotesk',Inter,sans-serif;font-size:26px;letter-spacing:-.02em}
.brand span{color:#a3a8b0;font-size:14px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{color:#d6d8dc;text-decoration:none;padding:0 14px;border-radius:10px;font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
nav a:hover{background:#252931;color:#fff}
nav a[aria-current=page]{background:#ff8a4c;color:#141414}
main{max-width:1180px;margin:0 auto;padding:24px max(4vw,16px) 40px}
.view[hidden]{display:none}
.mut{color:var(--mut)}
.small{font-size:13px;color:var(--mut)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--acc);font-weight:600;font-size:15px;cursor:pointer;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;line-height:1.5}
.chip.neu,.chip.tat{background:var(--surf2);color:var(--ink)}
.chip.spar{background:var(--accs);color:var(--acc2)}
.chip.ses{background:var(--acc);color:var(--onacc)}
.chip.test{background:var(--teals);color:var(--teal)}
.chip.rest{color:var(--mut);padding-left:0}
.chip.modc{background:transparent;border:1px solid var(--acc);color:var(--acc2)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.t-tec{background:var(--teals);color:var(--teal)}
.t-fis{background:var(--accs);color:var(--acc2)}
.t-peso{background:var(--vios);color:var(--vio)}
.t-dolor{background:var(--surf2);color:var(--ink)}
/* questionnaire */
.qw{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.blk{font-size:13px;font-weight:700;color:var(--acc2)}
.prog{height:6px;background:var(--surf2);border-radius:3px;margin:4px 0 18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.qcard h1{font-size:clamp(25px,3vw,33px);margin-bottom:6px}
.qcard h1:focus{outline:none}
.opts{display:grid;gap:8px;margin:16px 0}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-weight:500;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--mut)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);flex:none}
.opt.multi .dot{border-radius:6px}
.opt[aria-pressed=true]{border-color:var(--acc);background:var(--accs)}
.opt[aria-pressed=true] .dot{border-color:var(--acc);background:radial-gradient(circle,var(--acc) 0 42%,transparent 47%)}
.opt.multi[aria-pressed=true] .dot{background:var(--acc)}
.opt small{display:block;color:var(--mut);font-size:14px;font-weight:400}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0 4px}
.field label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.field input,.field select{width:100%;min-height:48px;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.sub{font-weight:600;margin:18px 0 0}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:6px;margin:14px 0}
.day{min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer}
.day[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.live .lt{font-family:'Space Grotesk',Inter,sans-serif;font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.08;margin:6px 0 4px}
.live h3{margin-top:16px}
.live ul,.ul{margin:8px 0 0;padding-left:20px}
.live li,.ul li{margin:4px 0}
.lead-prog{font-weight:700;color:var(--acc2);font-size:18px}
/* dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:stretch}
.hero-l{display:flex;flex-direction:column;justify-content:center}
.hook{font-family:'Space Grotesk',Inter,sans-serif;font-size:clamp(21px,2.4vw,27px);font-weight:600;line-height:1.2;color:var(--acc2);margin:10px 0 4px;letter-spacing:-.01em}
.promise{font-size:17px;margin:6px 0}
.ex-note{font-size:14px;color:var(--mut);margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:108px}
.kpi span{font-size:13px;color:var(--mut);font-weight:600}
.kpi b{font-family:'Space Grotesk',Inter,sans-serif;font-size:clamp(23px,2.5vw,30px);line-height:1.1;letter-spacing:-.02em}
.kpi small{font-size:13px;color:var(--mut)}
.kpi.hot{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.kpi.hot span,.kpi.hot small{color:var(--onacc)}
.bar8{height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.bar8 i{display:block;height:100%;background:var(--teal);border-radius:4px}
details.acc{border:1px solid var(--line);border-radius:16px;background:var(--surf);margin-top:14px}
details.acc>summary,details.ses>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:2px}
details.acc>summary{padding:14px 18px;min-height:64px;border-radius:16px}
details.acc>summary::-webkit-details-marker,details.ses>summary::-webkit-details-marker{display:none}
details.acc>summary:hover{background:var(--surf2)}
summary h2,summary h3,summary .sm{grid-column:1}
summary .sm{font-size:14px;color:var(--mut)}
summary .chev{grid-column:2;grid-row:1 / span 2}
.chev{width:30px;height:30px;flex:none;border-radius:50%;background:var(--surf2);display:grid;place-items:center;transition:transform .2s;color:var(--ink)}
details[open]>summary .chev{transform:rotate(180deg)}
.accb{padding:4px 18px 18px}
.diag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel h3{margin-bottom:6px}
.big{font-family:'Space Grotesk',Inter,sans-serif;font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:2px 0 6px}
.frenos{list-style:none;margin:6px 0 0;padding:0}
.frenos li{padding:8px 0;border-top:1px solid var(--line)}
.frenos li:first-child{border-top:0}
.frenos b{display:block}
.prog-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.load{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end;min-height:190px;margin-top:6px}
.lc{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:6px;border:0;background:none;color:var(--ink);padding:0;cursor:pointer;border-radius:8px}
.lc .tg2{font-size:13px;font-weight:700;color:var(--teal);min-height:20px;text-align:center}
.lc .bar{display:block;height:calc(var(--h) * 1.4px);border-radius:8px 8px 4px 4px;border:2px solid transparent;transition:height .4s}
.lc .bar.p1{background:color-mix(in srgb,var(--acc) 45%,var(--bg))}
.lc .bar.p2{background:var(--acc)}
.lc .bar.dl{background:var(--surf2)}
.lc .wl{font-size:13px;font-weight:600;text-align:center;color:var(--mut)}
.lc.on .bar{border-color:var(--ink)}
.lc.on .wl{color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.wsel{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.wsel button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer}
.wsel button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dcell{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:100px;background:var(--bg);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.dcell .dn{font-weight:700;font-size:14px}
.dcell .chip{text-align:left}
.dcell.has{border-color:var(--acc)}
details.ses{border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-top:10px}
details.ses>summary{padding:12px 14px;min-height:56px;border-radius:12px}
details.ses>summary:hover{background:var(--surf)}
.sesb{padding:0 14px 12px}
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,44%);gap:2px 16px;padding:10px 0;border-top:1px solid var(--line)}
.ex .p{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ex small{display:block;color:var(--teal);font-size:13px;font-weight:600}
.note{font-size:14px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0 0}
.mod{margin-top:12px;border-top:2px solid var(--acc);padding-top:10px}
.mod .mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.mod h3{color:var(--acc2)}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.test{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.test .tn{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.test .tgt{font-size:14px;font-weight:600;color:var(--teal)}
.tin{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tin label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.tin input{width:84px;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);min-height:44px}
.meter{height:8px;background:var(--surf2);border-radius:4px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--teal);transition:width .3s}
.teach{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.teach li{background:var(--bg);border:1px solid var(--line);border-left:0;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.teach q{font-weight:600;quotes:'«' '»'}
.teach .btn{min-height:40px;padding:0 12px;font-size:14px}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.rec{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rec .rl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rec .rl button{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:14px;font-weight:600;padding:4px 12px;cursor:pointer}
.price{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;margin-top:4px;max-width:520px}
.price b{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
/* today, logger and load */
.mt{margin-top:16px}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.kpi:hover{border-color:var(--mut)}
button.kpi.hot:hover{background:var(--acc2);border-color:var(--acc2)}
.hoy-top{display:flex;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.ptabs{display:flex;gap:6px;flex-wrap:wrap}
.ptabs button,.chips2 button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.ptabs button[aria-pressed=true],.chips2 button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ck{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:6px}
.ckh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.ckq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg3 button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;padding:0 6px}
.seg3 button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.ck.done{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.ck-verde{--rc:var(--teal)}.ck-ambar{--rc:var(--amb)}.ck-rojo{--rc:var(--red)}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p) * 1%),var(--surf2) 0);display:grid;place-items:center}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:'Space Grotesk',Inter,sans-serif;font-size:20px}
.ckst{font-weight:700;color:var(--rc)}
.exc{border-top:1px solid var(--line);padding:14px 0}
.player>.note+.exc,.player>.exc:first-child{margin-top:6px}
.exh{display:flex;justify-content:space-between;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
.exh .rx{font-weight:700;font-variant-numeric:tabular-nums}
.exh .sub{display:block;color:var(--teal);font-size:13px;font-weight:600}
.cue{font-size:14px;color:var(--mut);margin:4px 0 0}
.sug{font-size:14px;margin:8px 0 0;padding:6px 10px;border-radius:8px;background:var(--teals)}
.sug.warn{background:var(--accs)}
.shd,.srow{display:grid;grid-template-columns:40px repeat(var(--nc,2),minmax(0,1fr)) 48px;gap:6px;align-items:center;max-width:560px}
.shd{font-size:12px;color:var(--mut);font-weight:600;margin-top:10px}
.shd span:first-child{text-align:center}
.srow{margin-top:6px}
.srow input,.srow select{width:100%;min-height:44px;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.srow .sn{font-weight:700;font-size:14px;color:var(--mut);text-align:center}
.srow.dn{background:var(--teals);border-radius:10px}
.srow.dn .dv{grid-column:2 / -2;font-weight:600}
.srow.blk{grid-template-columns:minmax(0,1fr) 48px;margin-top:8px}
.srow.blk>span{padding-left:4px}
.tick{min-height:44px;min-width:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--mut);font-size:18px;font-weight:700;cursor:pointer}
.tick:hover{border-color:var(--teal);color:var(--teal)}
.tick[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.err{border-color:var(--red)!important;outline:2px solid var(--red)}
.fin{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;padding-top:14px;border-top:2px solid var(--line)}
.fin-hint{margin-top:10px}
.fin-f{margin-top:6px;padding-top:14px;border-top:2px solid var(--line)}
.rpe10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:10px 0}
.rpe10 button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer}
.rpe10 button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.fin-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.fin-row .field{width:140px}
.restbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:10px;background:#0f1114;color:#f2f2ee;border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 8px 28px rgba(0,0,0,.35);max-width:calc(100vw - 24px)}
.restbar[hidden]{display:none}
.restbar .rt{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.restbar .rn{color:#a3a8b0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.restbar button{min-height:44px;border-radius:999px;border:1px solid #2e323a;background:#252931;color:#f2f2ee;font-weight:600;padding:0 14px;cursor:pointer;white-space:nowrap}
.restbar.go{background:#0f766e}
.sum{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:8px}
.sumh{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.okc{width:40px;height:40px;border-radius:50%;background:var(--teal);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.sumk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:8px}
.sumk div{background:var(--surf);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.sumk span,.sumk small{font-size:13px;color:var(--mut)}
.sumk b{font-family:'Space Grotesk',Inter,sans-serif;font-size:24px}
.sum h3{margin-top:12px}
.lgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.lplot{position:relative;height:180px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end;border-bottom:1px solid var(--line)}
.lcol{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;height:100%}
.lv{font-size:13px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.lstack{display:flex;flex-direction:column;border-radius:8px 8px 2px 2px;overflow:hidden}
.lstack i{display:block;min-height:0}
.lf{background:var(--acc)}.lm{background:color-mix(in srgb,var(--acc) 40%,var(--bg))}
.lcol.now .lstack{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.lavg{position:absolute;left:0;right:0;border-top:2px dashed var(--teal);pointer-events:none}
.llab{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;font-size:12px;color:var(--mut);text-align:center;margin-top:6px}
.legend .dash{display:inline-block;width:14px;height:0;border-top:2px dashed var(--teal);margin-right:6px;vertical-align:3px}
.ratio-card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rbig{font-family:'Space Grotesk',Inter,sans-serif;font-size:44px;font-weight:700;line-height:1.05;margin:4px 0}
.z-ok{color:var(--teal)}.z-alta{color:var(--red)}.z-baja{color:var(--amb)}
.ents{list-style:none;margin:6px 0 0;padding:0}
.ents li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ents b{font-variant-numeric:tabular-nums}
.mform{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:16px}
.mrow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mrow>span{font-weight:600;font-size:14px}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chips2 button{padding:0 12px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.okmsg{margin:10px 0 0;font-weight:600;color:var(--teal)}
.e1g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:8px}
.e1c{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.e1c svg{display:block;width:100%;height:44px;margin-top:6px}
.sesgo{margin-top:12px}
@media(max-width:760px){.lgrid{grid-template-columns:1fr}.ckq{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}}
@media(max-width:600px){.rpe10{grid-template-columns:repeat(5,minmax(0,1fr))}.sumk b{font-size:20px}.restbar .rn{display:none}.ck.done{grid-template-columns:auto minmax(0,1fr)}.ck.done .link{grid-column:1 / -1;justify-self:start}}
/* diagnosis v4 and technique */
.dblk+.dblk{margin-top:6px}
.dblk .opts{margin-top:8px}
.fields.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fcl{max-width:300px;margin-top:16px}
.opts2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt .pn{display:block;font-weight:700;font-size:17px}
.opt small.ph{color:var(--acc2);font-weight:600}
.qualw{margin-bottom:16px}
.quals{list-style:none;margin:8px 0 6px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:8px}
.quals li{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.quals .tag{white-space:normal}
.drills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:10px}
.drill{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.vid{aspect-ratio:16/9;background:linear-gradient(135deg,var(--surf2),var(--surf));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:13px;font-weight:600;text-align:center;padding:10px}
.vid svg{color:var(--acc)}
.dbody{padding:12px 14px 14px}
.dbody h3{margin-bottom:4px}
.how{margin:8px 0;padding-left:20px;font-size:14px}
.how li{margin:2px 0}
.dose{font-size:14px;margin:0}
.mod.tech{border-top-color:var(--teal)}
.mod.tech h3{color:var(--teal)}
@media(max-width:600px){.opts2{grid-template-columns:1fr}}
/* providers */
.pv-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:end}
.hlt{background:var(--teals);border-color:transparent}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 16px}
.fchip{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:15px;padding:0 16px;cursor:pointer}
.fchip span{color:var(--mut);font-weight:500;margin-left:6px}
.fchip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed=true] span{color:inherit}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.pcard{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.pcard h3{margin-top:8px}
.pc-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.cat{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surf2)}
.cat.c-fisio,.cat.c-nutri{background:var(--teals);color:var(--teal)}
.cat.c-escuela{background:var(--accs);color:var(--acc2)}
.badge{font-size:13px;color:var(--mut);border:1px dashed var(--line);border-radius:999px;padding:1px 10px}
.town{font-size:14px;color:var(--mut);margin:0}
.pr{font-weight:600;color:var(--teal);margin:4px 0}
.pn{font-size:14px;color:var(--mut)}
.pcard a{margin-top:auto;padding-top:8px;font-weight:600;font-size:15px}
footer{max-width:1180px;margin:0 auto;padding:20px max(4vw,16px) 40px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
@media(max-width:900px){.diag{grid-template-columns:1fr}.prog-grid{grid-template-columns:1fr}}
@media(max-width:860px){.qw,.hero,.pv-head{grid-template-columns:1fr}}
@media(max-width:700px){.tests{grid-template-columns:1fr}}
@media(max-width:600px){.wk{grid-template-columns:1fr;gap:6px}.dcell{flex-direction:row;flex-wrap:wrap;align-items:center;min-height:52px}.dcell .dn{width:90px}.fields{grid-template-columns:1fr}.ex{grid-template-columns:1fr}.ex .p{text-align:left}.load{gap:5px}nav{margin-left:0}.teach li{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Freeletics-style shell for Rendai (layered on base component styles) ===== */
body{background:light-dark(#e9e9e6,#060708)}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:88px;box-shadow:0 0 60px rgba(0,0,0,.18)}
.phase-onboard #app{padding-bottom:0}
.scr{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.scr{animation:none}}
.pad{padding:20px max(5vw,18px)}
.dark{background:#0d0f12;color:#f3f3ef}
.dark .mut,.dark .small{color:#9aa0a8}
.hero-img{position:relative;background:#0d0f12;color:#f3f3ef;overflow:hidden}
.hero-img::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 80% -10%,color-mix(in srgb,var(--acc) 55%,transparent),transparent 60%),radial-gradient(90% 80% at -10% 110%,color-mix(in srgb,var(--teal) 45%,transparent),transparent 55%);opacity:.9}
.hero-img>*{position:relative}
.kick{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.dark .kick{color:var(--acc)}
.display{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;letter-spacing:-.03em;line-height:1.02;font-size:clamp(34px,10vw,46px);text-wrap:balance}
.display.sm{font-size:clamp(26px,7vw,34px)}
.lead2{font-size:17px;line-height:1.5;color:#cdd1d6}
/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px max(5vw,18px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wm{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em}
.bar .wbadge{font-size:13px;font-weight:700;color:var(--acc2);background:var(--accs);padding:3px 10px;border-radius:999px}
.bar .sp{margin-left:auto}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{min-height:36px;padding:0 12px;border:0;background:var(--bg);color:var(--mut);font-weight:700;font-size:13px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
/* bottom nav */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{border:0;background:none;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:11px;font-weight:600;cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current=page]{color:var(--acc2)}
.tabbar button[aria-current=page] .ic{background:var(--accs)}
.ic{width:46px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
/* buttons */
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;border:0;background:var(--acc);color:var(--onacc);font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:18px;letter-spacing:-.01em;cursor:pointer}
.cta:hover{background:var(--acc2)}
.cta.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.cta.ghost:hover{border-color:var(--mut)}
.cta.on-dark.ghost{color:#f3f3ef;border-color:#363b42}
.cta:disabled{opacity:.5;cursor:not-allowed}
.cta.sm{min-height:48px;font-size:16px;border-radius:14px}
/* progress ring */
.ringbig{width:116px;height:116px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--surf2) 0)}
.ringbig b{width:92px;height:92px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:'Space Grotesk',Inter,sans-serif}
.ringbig .n{font-size:30px;font-weight:700;line-height:1}
.ringbig .u{font-size:12px;color:var(--mut);font-weight:600}
.dark .ringbig b{background:#0d0f12}
/* goal & plan cards */
.goalgrid{display:grid;gap:12px}
.goalc{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:16px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);cursor:pointer}
.goalc:hover{border-color:var(--mut)}
.goalc[aria-pressed=true]{border-color:var(--acc);background:var(--accs)}
.goalc .gi{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;background:var(--surf2)}
.goalc[aria-pressed=true] .gi{background:var(--acc);color:var(--onacc)}
.goalc .gi svg{width:24px;height:24px}
.goalc h3{font-size:17px}
.goalc p{font-size:14px;color:var(--mut);margin:3px 0 0}
.goalc .chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.goalc[aria-pressed=true] .chk{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.planc{text-align:left;width:100%;border:1.5px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);cursor:pointer;overflow:hidden}
.planc:hover{border-color:var(--mut)}
.planc[aria-pressed=true]{border-color:var(--acc)}
.planc .pt{padding:16px 16px 14px;background:#0d0f12;color:#f3f3ef;position:relative}
.planc[aria-pressed=true] .pt{background:var(--acc);color:var(--onacc)}
.planc .pt h3{font-family:'Space Grotesk',Inter,sans-serif;font-size:22px;letter-spacing:-.02em}
.planc .pt .ph{font-size:14px;color:#cdd1d6;margin-top:3px}
.planc[aria-pressed=true] .pt .ph{color:var(--onacc);opacity:.92}
.planc .pb{padding:14px 16px}
.planc .pb .tag{margin:0 6px 6px 0}
.rec-badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--teal);color:#042}
.planc[aria-pressed=true] .rec-badge{background:#fff;color:var(--acc2)}
/* today session card */
.sess-hero{border-radius:20px;overflow:hidden;background:#0d0f12;color:#f3f3ef;position:relative}
.sess-hero .band{height:116px;background:radial-gradient(130% 120% at 85% 0%,color-mix(in srgb,var(--acc) 70%,transparent),transparent 62%),linear-gradient(120deg,#16191e,#0d0f12);display:flex;align-items:flex-end;padding:14px 18px}
.sess-hero .band .k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#cdd1d6}
.sess-hero .sb{padding:16px 18px 18px}
.sess-hero h2{font-family:'Space Grotesk',Inter,sans-serif;font-size:24px;letter-spacing:-.02em}
.sess-hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:#9aa0a8;font-size:14px;margin:6px 0 14px}
.rowcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--bg);width:100%;text-align:left;color:var(--ink);cursor:pointer}
.rowcard:hover{border-color:var(--mut)}
.rowcard .ri{width:42px;height:42px;border-radius:12px;background:var(--surf2);display:grid;place-items:center;flex:none;color:var(--acc2)}
.rowcard .rt{font-weight:700}
.rowcard .rs{font-size:13px;color:var(--mut)}
.rowcard .arr{margin-left:auto;color:var(--mut)}
.coachline{display:flex;gap:12px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;padding:12px 14px;font-size:15px}
.coachline .av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.section-h h2{font-family:'Space Grotesk',Inter,sans-serif;font-size:19px;letter-spacing:-.01em}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statb{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.statb .n{font-family:'Space Grotesk',Inter,sans-serif;font-size:24px;font-weight:700}
.statb .l{font-size:13px;color:var(--mut)}
/* journey week strip */
.weekstrip{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.wk2{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;cursor:pointer;color:var(--ink)}
.wk2 .bar{width:100%;height:46px;border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;background:var(--surf2)}
.wk2 .bar i{width:100%;border-radius:8px 8px 0 0}
.wk2 .p1 i{background:color-mix(in srgb,var(--acc) 42%,var(--bg))}
.wk2 .p2 i{background:var(--acc)}
.wk2 .p3 i{background:var(--acc2)}
.wk2 .dl i{background:var(--surf2);border:1px dashed var(--mut)}
.wk2 .wl{font-size:11px;font-weight:700;color:var(--mut)}
.wk2.on .wl{color:var(--ink)}
.wk2.on .bar{outline:2px solid var(--ink);outline-offset:1px}
.wk2 .ms{font-size:11px;color:var(--teal)}
.need{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.need li{display:flex;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14.5px}
.need li .d{color:var(--acc2);flex:none;font-weight:800}
.outs{display:grid;gap:10px}
.outc{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--bg)}
.outc .g{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2)}
.outc p{margin:4px 0 0;font-size:15px}
.mstone{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.mstone:first-child{border-top:0}
.mstone .w{width:52px;flex:none;font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;color:var(--acc2)}
.mstone ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;flex:1}
.mstone li{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.mstone .dot2{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px}
.mstone li.done .dot2{background:var(--teal);border-color:var(--teal)}
.plabel{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
/* progress bar */
.pbar{height:14px;border-radius:8px;background:var(--surf2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.fb-wk{display:grid;gap:8px}
.fb-row{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.stars{display:flex;gap:4px}
.stars button{min-height:40px;min-width:40px;border:0;background:none;cursor:pointer;color:var(--surf2);font-size:26px;line-height:1}
.stars button.on{color:var(--acc)}
/* vendor map */
.vmap{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:light-dark(#eef2f0,#10161a)}
.vmap svg{display:block;width:100%;height:auto}
.vpin{cursor:pointer}
.vpin circle{stroke:#fff;stroke-width:1.5}
.vpin.sel circle{stroke:var(--ink);stroke-width:2.5}
.vfilters{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.vlist{display:grid;gap:10px}
.vcard{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--bg)}
.vcard.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--accs)}
.vcard .vh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vcat{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
.vcard .badge2{font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:999px;padding:1px 9px}
.vcard h3{margin-top:6px;font-size:16px}
.vcard .vl{font-size:13px;color:var(--mut)}
.vcard a{font-weight:600;font-size:14px}
/* survey niceties reuse .opts/.opt from base */
.surv .qcard{border:0;background:none;padding:0}
.minis{display:flex;gap:8px;flex-wrap:wrap}
.pill-in{display:flex;flex-direction:column;gap:5px}
.scale10{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.scale10 button{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer}
.scale10 button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.obhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.obhead .pg{flex:1;height:6px;border-radius:3px;background:var(--surf2);overflow:hidden}
.obhead .pg i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.disc-note{font-size:12.5px;color:var(--mut);background:var(--surf);border-radius:10px;padding:9px 12px;margin-top:14px}
.svc-row{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.svc-row .sw{width:70px;flex:none;font-weight:700;color:var(--acc2);font-size:14px}
/* fix: block-level spans inside button cards */
.rowcard .rt,.rowcard .rs{display:block}
.planc .pt,.planc .pb,.planc .pt .ph,.plabel{display:block}
.statb .n,.statb .l{display:block}
.outc .g{display:block}
.goalc h3,.goalc p{display:block}
/* v6 minimal plan boxes + mode toggle + class capture */
.planc.min .pt{padding:14px 16px}
.mline{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mline:first-child{border-top:0}
.ml-k{width:84px;flex:none;font-weight:700;color:var(--mut);text-transform:uppercase;font-size:11px;letter-spacing:.05em;padding-top:2px}
.tog{display:flex;gap:12px;align-items:flex-start;margin-top:14px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.tog input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--acc)}
.sess-hero .chips .chip{white-space:normal}

/* v6.1 */
.newplan{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.newplan:hover{border-color:var(--mut)}
.stepl{font-size:13px;font-weight:700;color:var(--mut);margin:4px 0 0}
.miss{min-height:20px;margin:8px 0 0;font-size:14px;font-weight:600;color:var(--acc2);text-align:center}
.miss:empty{display:none}
.mline.why span:last-child{color:var(--teal);font-weight:600}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:grid;gap:10px}
.sheet h2{font-family:'Space Grotesk',Inter,sans-serif;font-size:22px}
.paybox{background:#14181d;border:1px solid #2a2f36;border-radius:16px;padding:16px;display:grid;gap:6px}
.paybox .pk{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5fd4c8}
.paybox .pp{margin:0;font-size:15px;color:#cdd1d6}
.paybox .pp b{font-family:'Space Grotesk',Inter,sans-serif;font-size:30px;color:#f3f3ef}
.tog.dk{background:#1b2026;border-color:#2a2f36;color:#e8e9e6;margin-top:6px}
.trialp{font-size:13px;font-weight:600;color:var(--teal);margin:2px 0 0}
.classday{border-color:var(--acc);background:var(--accs)}
.rowcard .ri{font-size:20px}
.bar{gap:8px}
.bar .wbadge{white-space:nowrap}
.bar .newplan{padding:0 10px}
.bar .lang button{padding:0 10px}

/* ===== v7.1 · real-time usability ===== */
.hoytop{display:flex;gap:14px;align-items:center;justify-content:space-between}
.ringsm{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--surf2) 0)}
.ringsm b{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:'Space Grotesk',Inter,sans-serif;font-size:16px}
.classcard{border:1.5px solid var(--acc);background:var(--accs);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.cc-h{display:flex;gap:12px;align-items:center}
.cc-h .ri{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.cc-h .rt{display:block;font-weight:700}.cc-h .rs{display:block;font-size:14px;color:var(--mut)}
.classcard .link{justify-self:center}
.classday.ok{border-color:var(--teal);background:var(--teals)}
.classday.ok .ri{color:var(--teal);font-weight:800}
/* session focus mode */
body.insess #app{padding-bottom:110px}
.sesswrap{padding-top:10px}
.sesstop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line)}
.exit{min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.sesst{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl{margin:8px 0 0}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 4px;font-size:14px;font-weight:700;color:var(--mut)}
.fdots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.fdots i{width:8px;height:8px;border-radius:50%;background:var(--surf2)}
.fdots i.ok{background:var(--teal)}.fdots i.on{background:var(--acc);transform:scale(1.35)}
.exc.focus{border-top:0;padding-top:4px}
.exn{font-family:'Space Grotesk',Inter,sans-serif;font-size:22px;letter-spacing:-.01em;line-height:1.15}
.setl{margin:8px 0 0;font-size:15px;font-weight:700;color:var(--acc2)}
.bigt{margin:2px 0 6px;font-family:'Space Grotesk',Inter,sans-serif;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.player .small,.player .cue,.player .sug,.player .note,.player .how{font-size:15px}
.srow.act{grid-template-columns:36px repeat(var(--nc,1),minmax(0,1fr)) 68px;align-items:end;max-width:none;margin-top:10px}
.fin2{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mut)}
.srow.act input{min-height:56px;font-size:22px;font-weight:700;text-align:center}
.tick.big{min-width:64px;min-height:64px;font-size:26px;border-radius:16px;background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.tick.big:hover{background:var(--acc2);color:var(--onacc)}
.eff{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.eff button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer}
.eff button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.srow.pv{opacity:.6}
.srow.dn .dv,.srow.pv .dv{font-size:15px}
.bigtick{width:100%;min-height:64px;border-radius:16px;border:0;background:var(--acc);color:var(--onacc);font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:18px;cursor:pointer;margin-top:8px}
.bigtick[aria-pressed=true]{background:var(--teal)}
.more,.all{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:0 14px}
.more summary,.all summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.allx{padding-left:20px;margin:0 0 10px}.allx li{margin:2px 0}
.fnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fnav .cta{min-height:52px}
.fin.all{flex-direction:column;align-items:stretch;text-align:center}
.alldone{font-family:'Space Grotesk',Inter,sans-serif;font-size:22px;font-weight:700;margin:0}
/* rest timer: big, full-width, in place of the tab bar during a session */
body.insess .restbar{left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));justify-content:space-between;gap:10px}
body.insess .restbar .rt{font-size:34px}
body.insess .restbar .rn{display:block;max-width:none;flex:1;font-size:14px;white-space:normal}
.restbar button{min-height:48px;min-width:48px}
/* save error + upload states */
.savebar{position:sticky;top:0;z-index:70;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--red);color:#fff;padding:10px 16px;font-weight:600;font-size:14px}
.savebar button{min-height:40px;border:1px solid #fff;background:transparent;color:#fff;border-radius:10px;font-weight:700;padding:0 12px;cursor:pointer}
.upst{font-size:14px;font-weight:600;margin:12px 0 4px;padding:8px 12px;border-radius:10px}
.up-pending{background:var(--accs);color:var(--acc2)}.up-uploading{background:var(--surf2)}.up-done{background:var(--teals);color:var(--teal)}
/* touch targets >= 44px */
.sess-hero .chips .chip{min-height:44px;display:inline-flex;align-items:center}
.minis button.tag{min-height:44px;padding:0 16px}
.obhead .link{min-width:44px;min-height:44px;font-size:22px}
.stars button{min-width:44px;min-height:44px}
.bar .lang button,.bar .newplan{min-height:44px}
.vpin circle.hit{stroke:none}
/* readable text */
.small,.rowcard .rs{font-size:14px}
.tabbar button{font-size:12px}
.ml-k,.plabel{font-size:12px}

.ckline{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:4px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surf);font-size:15px}
.ckline .cdot{width:12px;height:12px;border-radius:50%;background:var(--rc);flex:none}
.ckline .link{margin-left:auto}
.ckline b{white-space:nowrap}
.ckline .small{flex:1;min-width:0}
/* ===== v8 onboarding + asks ===== */
.chips4{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chipb{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surf);color:inherit;font:inherit;font-weight:650;font-size:15px;cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.belts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.belt{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:64px;padding:8px 2px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);color:inherit;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer}
.belt .bs{width:100%;max-width:46px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.18)}
.b-blanco .bs{background:#f4f4f2}.b-azul .bs{background:#1f5fbf}.b-morado .bs{background:#6b2fa3}.b-marron .bs{background:#6b4226}.b-negro .bs{background:#111;box-shadow:inset 34px 0 0 -26px #c0392b}
.belt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.stripes{display:flex;gap:6px;margin:6px 0}
.stripes button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:#111;color:#fff;font:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.stripes button i{display:block;width:5px;height:20px;background:#fff;border-radius:1px}
.stripes button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--teal,#14b8a6)}
.chk.num{font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.goalc[aria-pressed="true"] .chk.num{color:#fff}
.whyrow{margin-top:12px;padding:12px;border-radius:14px;background:var(--surf)}
.whyrow .sub{margin:0 0 6px}
.preview{margin-top:16px;padding:14px;border-radius:14px;border:1.5px dashed var(--teal,#14b8a6)}
.preview ul{margin:6px 0 0;padding-left:18px}.preview li{margin:3px 0;font-weight:600}
.seg3.two{grid-template-columns:1fr 1fr}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 2px;text-align:center;min-height:62px}
.wd b{display:block;font-size:12px;color:#cdd1d6}.wd span{display:block;font-size:10.5px;line-height:1.3;margin-top:4px;color:#8b9198}
.wd.on{background:rgba(20,184,166,.18)}.wd.on span{color:#e7fbf8;font-weight:700}
.outc.dk{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;color:#eef0f2}
.outc.dk .g{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#5eead4;font-weight:800}
.outc.dk p{margin:4px 0 0}.outc.dk .small{color:#a9afb6}
.hero-img .lead2{color:#cdd1d6;margin:0}
.askcard{margin-top:14px;padding:14px;border-radius:16px;background:var(--surf);border:1.5px solid var(--line)}
.askcard .ak-t{font-weight:800;margin:0}.askcard .ak-x{margin:4px 0 8px}
.askcard.dk{background:#111418;color:#eef0f2;border-color:#111418}.askcard.dk .small{color:#9aa0a8}
.askcard .link{display:block;margin:8px auto 0}
.acctb{display:grid;gap:8px;margin-top:6px}
.cta.sm{min-height:46px;font-size:15px}
.ckq.pain{margin-bottom:6px}
.cprow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.cprow input{flex:1;min-width:110px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);padding:0 12px;font:inherit;font-size:16px}
.cprow input[aria-invalid="true"]{border-color:#dc2626}
.locl{margin-top:8px}
.chipb,.belt{color:var(--ink)}
.whyrow{background:var(--surf2)}
.askcard .chipb,.askcard .seg3 button,.whyrow .seg3 button{background:var(--bg)}
.askcard .chipb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.askcard .seg3 button[aria-pressed=true],.whyrow .seg3 button[aria-pressed=true]{background:var(--acc);color:var(--onacc)}
.askcard.dk .chipb,.askcard.dk .seg3 button{background:#1c2026;color:#eef0f2;border-color:#2c3138}
/* ===== v9 Pro-Lab ===== */
.plhead{margin-top:4px}.plhead .mut{margin-top:4px}
.demob{margin-top:10px;padding:8px 12px;border-radius:10px;font-size:12.5px;line-height:1.4;background:light-dark(#fff7e6,#2a2210);color:light-dark(#7a4b00,#f5d08a);border:1px solid light-dark(#f3d9a4,#4a3a12)}
.demo{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:6px;background:light-dark(#fde68a,#4a3a12);color:light-dark(#7a4b00,#f5d08a);vertical-align:middle}
.plsegs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:16px;padding:4px;border-radius:14px;background:var(--surf)}
.plsegs button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--mut);font:inherit;font-weight:750;font-size:14px;cursor:pointer}
.plsegs button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.plsub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.plsub .small{margin:0}
.pltog{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.pltog button{min-height:36px;padding:0 14px;border:0;background:var(--bg);color:var(--ink);font:inherit;font-weight:650;font-size:13px;cursor:pointer}
.pltog button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pklist{display:grid;gap:8px}
.pkc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;min-height:64px}
.pkd{width:10px;align-self:stretch;border-radius:6px;flex:none}
.pkb{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.pkk{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.pkt{font-weight:750;font-size:15.5px;line-height:1.25}
.pks{font-size:13px;color:var(--mut)}
.pkp{flex:none;text-align:right;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:flex-end}
.pkp s,.plp s,.plprice s{font-weight:500;font-size:12.5px;color:var(--mut)}
.plcard{margin-top:14px;padding:14px;border-radius:16px;background:var(--surf);border-left:4px solid var(--teal)}
.plk{font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--teal);margin:0}
.plt{font-weight:800;font-size:17px;margin:4px 0 0;line-height:1.3}
.plx{margin:6px 0 10px;line-height:1.45}
.plrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;margin-bottom:10px}
.plp{font-weight:800;white-space:nowrap;display:flex;gap:5px;align-items:baseline}
.plno{display:flex;justify-content:space-between;margin-top:6px}
.plno .link{margin:0}
.plcard .small{margin:8px 0 0}
.askcard.plc{border-left:4px solid var(--teal)}
.pld .pldh{margin-top:12px;padding-left:12px;border-left:4px solid var(--pc)}
.pld .pldh .display{margin:2px 0 4px}
.plprice{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:14px 0 4px;padding:14px;border-radius:14px;background:var(--surf)}
.plprice b{font-size:28px;font-weight:850}.plprice span{font-size:13px;color:var(--mut);margin-left:auto}

.pldl dt{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.pldl dd{margin:2px 0 0;line-height:1.45}
.plwarn{margin:4px 0 14px;padding:12px;border-radius:12px;background:light-dark(#e0f2fe,#0c2233);color:light-dark(#0c4a6e,#bae6fd);font-size:14px;line-height:1.45}
.plcode{margin-top:10px;padding:16px;border-radius:16px;border:2px dashed var(--teal);text-align:center}
.plcode b{display:block;font-size:30px;letter-spacing:.12em;margin:6px 0;font-family:ui-monospace,Menlo,monospace}
.plcode .small{margin:4px 0}
.plpart{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--teal)}
.plfoot{margin-top:18px;opacity:.7}

/* ===================== v12 · Clean Light (Apple / Linear) =====================
VOICE: calm, precise. IDEA: a well-made training notebook. PICTURE: photo cards with soft overlays.
COLOUR: #F7F8FA bg, #FFFFFF cards, #E1E7E5 borders, #0F2A2A ink, #5E6E6C secondary, #113838 action, #10B981 positive, #EF4444 risk.
TYPE: Inter 400–700, tabular numbers. LAYOUT: white cards on soft ground, shadow-sm, 12–16px radii. */
:root,:root[data-theme=dark],:root[data-theme=light]{color-scheme:light;
--bg:#F7F8FA;--surf:#FFFFFF;--surf2:#EEF2F1;--surf3:#E1E7E5;--line:#E1E7E5;--lines:#C9D3D1;--ctl:#8A9997;
--ink:#0F2A2A;--mut:#5E6E6C;--ink3:#5E6E6C;
--acc:#113838;--acc2:#113838;--accs:#E8F0EF;--onacc:#FFFFFF;--volt:#113838;--onvolt:#FFFFFF;
--teal:#113838;--teals:#E8F0EF;--ice:#113838;--onice:#FFFFFF;--vio:#113838;--vios:#E8F0EF;
--pos:#10B981;--pos-t:#047857;--risk:#EF4444;--risk-t:#DC2626;--red:#DC2626;--amb:#B45309;
--fd:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;--fs:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--fm:"Inter",system-ui,sans-serif;
--sh:0 1px 2px rgba(15,42,42,.06),0 1px 1px rgba(15,42,42,.03)}
html,body{background:var(--bg)!important;color:var(--ink)}
body,#app,#app button,#app input,#app select,#app textarea{font-family:var(--fs)!important}
#app{font-feature-settings:"cv11","ss01"}
#app .tv,#app .bigt,#app .pkp,#app .plprice b,#app .kpi b,.vn-t,.rlab,.hero-meta b{font-variant-numeric:tabular-nums}
/* ---------- type ---------- */
#app h1,#app .display{font-family:var(--fd)!important;font-weight:700!important;letter-spacing:-.025em;line-height:1.05!important;color:var(--ink)!important;text-transform:none}
#app .display{font-size:clamp(32px,9vw,40px)}#app .display.sm{font-size:clamp(28px,8vw,34px)}
#app h2{font-weight:650;letter-spacing:-.015em;text-transform:none;font-size:20px;line-height:1.2}
#app h3{font-weight:600;letter-spacing:-.01em}
#app .kick,#app .plabel,#app .stepl,#app .section-h .small{font-size:12px;font-weight:600;letter-spacing:.01em;text-transform:none;color:var(--mut)}
#app .kick{color:var(--acc)}
.mono{font-family:var(--fs)!important;letter-spacing:0}
.wm{font-family:var(--fd)!important;font-weight:700!important;letter-spacing:-.02em;font-size:20px!important;color:var(--ink)}
.wbadge{background:var(--surf2)!important;color:var(--mut)!important;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600}
/* ---------- surfaces ---------- */
#app .card,#app .rowcard,#app .sum,#app .classcard,#app .ck,#app .exc,#app .askcard,#app .outc,#app .vcard,#app .plcard,#app .drill,#app .goalc,#app .planc,#app .sess-hero,#app .ckline,#app .plprice,#app .pldl,.glass{background:#FFFFFF!important;border:1px solid var(--line)!important;box-shadow:var(--sh)!important;color:var(--ink)}
#app .askcard.dk,#app .outc.dk{background:#FFFFFF!important;color:var(--ink)!important;border-color:var(--line)!important}
#app .askcard.dk .small,#app .outc.dk .small{color:var(--mut)!important}
#app .outc.dk .g{color:var(--acc)!important}
header.bar{background:rgba(247,248,246,.85)!important;backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)!important}
.tabbar{background:rgba(255,255,255,.88)!important;backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line)!important}

/* ---------- controls ---------- */

#app .cta.ghost{background:#fff!important;color:var(--ink)!important;border:1px solid var(--lines)!important;box-shadow:var(--sh)!important}
#app .cta[disabled]{background:var(--surf2)!important;color:#8A9997!important;border:0!important;box-shadow:none!important}
#app .link{color:var(--acc)}

#app :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.lic{width:18px;height:18px;flex:none;vertical-align:-3px}
.led{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pos);margin:0 4px;vertical-align:middle}
.led-on{background:var(--acc)}.led-amb{background:#F59E0B}.led-red{background:var(--risk)}.led-off{background:#C9D3D1}
.tc .led-on{background:var(--pos)}
/* ---------- onboarding step 4 + dark heroes → light ---------- */
.hero-img{background:var(--bg)!important;color:var(--ink)!important}
.hero-img::before{display:none!important}
.hero-img .lead2{color:var(--mut)!important}

.wd{background:#fff;border:1px solid var(--line)}.wd b{color:var(--ink)}.wd span{color:var(--mut)}
.wd.on{background:var(--accs);border-color:#C5D8D6}.wd.on span{color:var(--acc)}
#app .belt{background:#fff!important}
/* ---------- photo system ---------- */
.ph{position:relative;overflow:hidden;isolation:isolate;background-color:#E1E7E5}
.ph::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--art);background-size:cover;background-position:center}
.ph.has::before{background:var(--img) center/cover}
.ph::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(15,42,42,.82) 12%,rgba(15,42,42,.35) 55%,rgba(15,42,42,0))}
.ph-hero,.ph-crio,.ph-fisio,.ph-recup,.ph-gear,.ph-rend,.ph-nutri,.ph-plan,.ph-prog,.ph-clase,.ph-welcome,.ph-belt{--art:linear-gradient(160deg,#C9D3D1,#8A9997)}
/* light-washed photos where dark text sits on top */
.wel::after,.capph::after{background:linear-gradient(to top,#F7F8FA 34%,rgba(247,248,246,.75) 55%,rgba(247,248,246,.1))!important}
.p4ph::after,.pldph::after{background:linear-gradient(to top,rgba(247,248,246,.0),rgba(247,248,246,0))!important}
.p4ph{height:220px;margin:4px -16px 0;border-radius:0!important}
.pldph{height:200px;margin-top:10px;border-radius:14px!important;border:1px solid var(--line)}
.p4ph.has::before{background-position:center 35%}
.ph-fisio.has::before{background-position:center 30%}
#app .wel{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)!important}
.wel.ph::before,.wel.ph::after{display:block!important}
.wel.has::before{background-size:cover!important;background-position:center top!important;bottom:28%!important}
.wel>.pad:nth-child(2){justify-content:flex-end!important;padding-bottom:8px}
#app .capph{margin-top:18px;background:#fff!important}
.capph::before{bottom:auto!important;height:240px}
#app .capph .band{min-height:120px!important;background:transparent!important}
/* ---------- hero workout ---------- */
.hero{margin-top:16px;border-radius:18px!important;min-height:380px;display:flex;box-shadow:0 1px 3px rgba(15,42,42,.1),0 8px 24px -12px rgba(15,42,42,.25)!important}

.badge{font-size:12px;font-weight:600;padding:6px 10px 6px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);display:inline-flex;align-items:center;white-space:nowrap}

/* ---------- telemetry ---------- */

/* ---------- voice note ---------- */

function loadStats(){

const chronic=prev.reduce((n,w)=>n+w.mat+w.fis,0)/4,acute=weeks[0].mat+weeks[0].fis;

function parseRx(str){
const r={text:str,sets:0,kind:'block',lo:0,hi:0,perSide:/por lado|por pierna/.test(str),rpe:null};
const rp=str.match(/RPE (\d+)(?:–(\d+))?/);if(rp)r.rpe=+rp[1];
const m=str.match(/^(\d+)(\s(?:rondas))?\s×\s(.+)$/);
if(!m)return r;
r.sets=+m[1];const rest=m[3];let x;
if(m[2]){r.kind='rounds';return r}
if((x=rest.match(/^(\d+)(?:–(\d+))?\s*s\b/))){r.kind='time';r.lo=+x[1];r.hi=x[2]?+x[2]:+x[1];return r}
if((x=rest.match(/^(\d+)\s*m\b/))){r.kind='dist';r.lo=r.hi=+x[1];return r}
if(/^máximo/.test(rest)){r.kind='max';return r}
if((x=rest.match(/^(\d+)(?:–(\d+))?/))){r.kind='reps';r.lo=+x[1];r.hi=x[2]?+x[2]:+x[1];return r}
return r}
const isLoaded=id=>!!(EX[id]&&EX[id].inc);
function kindOf(id,rx){if(isLoaded(id)){if(rx.kind==='reps')return 'kg';if(rx.kind==='dist')return 'kgdist'}return rx.kind}
function tRpe(rx,ph,acc,cap){let t=rx.rpe!=null?rx.rpe:ph.dl?6:ph.k==='p1'?7:8;if(acc&&rx.rpe==null)t=Math.min(t,7);if(cap)t=Math.min(t,8);return t}
const e1=(kg,r,rpe)=>kg*(1+(r+Math.max(0,10-rpe))/30);
const kgFor=(e,r,rpe)=>e/(1+(r+Math.max(0,10-rpe))/30);
const rnd=(x,inc)=>Math.round(x/inc)*inc;
function hist(id){return (S.log.ses||[]).filter(s=>s.sets&&s.sets[id]&&s.sets[id].length).sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:0).map(s=>({date:s.date,week:s.week,sets:s.sets[id]}))}
function bestE1(sets){let b=0;for(const x of sets)if(x.kg>0&&x.reps>0&&x.rpe)b=Math.max(b,e1(x.kg,x.reps,x.rpe));return b}
function sugKg(id,reps,t,inc,ls){
const done=(ls||[]).filter(x=>x&&x.done&&x.kg>0&&x.reps>0&&x.rpe);
if(done.length){const l=done[done.length-1];let k=rnd(kgFor(e1(l.kg,l.reps,l.rpe),reps,t),inc);
 if(l.rpe>=t+1)k=Math.min(k,l.kg-inc);else if(l.rpe<=t-1)k=Math.max(k,l.kg+inc);else k=l.kg;
 k=Math.max(inc,Math.min(k,rnd(l.kg*1.1,inc)),rnd(l.kg*0.85,inc));
 const note=l.rpe>=t+1?L(`La serie ${done.length} te costó más de lo previsto: bajamos a ${fmt(k)} kg.`,`Set ${done.length} was harder than planned: dropping to ${fmt(k)} kg.`):l.rpe<=t-1?L(`La serie ${done.length} te resultó fácil: subimos a ${fmt(k)} kg.`,`Set ${done.length} felt easy: going up to ${fmt(k)} kg.`):'';
 return {kg:k,note,warn:l.rpe>=t+1}}
const H=hist(id).slice(0,2);
if(!H.length)return {kg:null,note:L('Primera vez: elige un peso con el que te sobren 2 o 3 repeticiones. A partir de aquí, la app calcula el resto.','First time: pick a weight that leaves 2 or 3 reps in the tank. From here, the app works out the rest.')};
const best=Math.max(...H.map(h=>bestE1(h.sets)));const ws=H[0].sets.filter(x=>x.kg>0);if(!ws.length||!best)return {kg:null,note:''};
const lastKg=Math.max(...ws.map(x=>x.kg)),lr=ws[ws.length-1];
let k=rnd(kgFor(best,reps,t),inc);
if(k>lastKg)k=Math.min(k,Math.max(rnd(lastKg*1.05,inc),lastKg+inc));
if(k<lastKg)k=Math.max(k,rnd(lastKg*0.9,inc));
const df=k-lastKg;
return {kg:k,note:L(`${df>0?`Sube ${fmt(df)} kg`:df<0?`Baja ${fmt(-df)} kg`:'Mismo peso'} respecto a la última vez (${fmt(lastKg)} kg × ${lr.reps}).`,`${df>0?`Up ${fmt(df)} kg`:df<0?`Down ${fmt(-df)} kg`:'Same weight'} from last time (${fmt(lastKg)} kg × ${lr.reps}).`)}}
function sugStep(id,t,inc,ls){
const done=(ls||[]).filter(x=>x&&x.done&&x.kg>0&&x.rpe);let base=done.length?done[done.length-1]:null;
if(!base){const h=hist(id)[0];if(h){const s=h.sets.filter(x=>x.kg>0);base=s[s.length-1]||null}}
if(!base)return {kg:null,note:L('Primera vez: elige un peso que puedas llevar con buena postura.','First time: pick a weight you can carry with good posture.')};
let k=base.kg;if(base.rpe<=t-1)k+=inc;else if(base.rpe>=t+1)k=Math.max(inc,k-inc);
return {kg:k,note:k>base.kg?L(`Sube ${fmt(inc)} kg: la última vez te resultó fácil.`,`Up ${fmt(inc)} kg: last time felt easy.`):k<base.kg?L(`Baja ${fmt(inc)} kg: la última vez te costó.`,`Down ${fmt(inc)} kg: last time was hard.`):'',warn:k<base.kg}}
function lastTxt(id,kind){const h=hist(id)[0];if(!h)return '';const s=h.sets,r=s[s.length-1]||{};
const v=kind==='time'?`${s.length} × ${r.sec} s`:kind==='rounds'?`${r.rounds} ${L('rondas','rounds')}`:`${s.length} × ${r.reps}`;
return L(`La última vez (${fmtS(fromIso(h.date))}): ${v}.`,`Last time (${fmtS(fromIso(h.date))}): ${v}.`)}
function restFor(kind,acc){return kind==='kg'?(acc?90:150):kind==='kgdist'?90:kind==='reps'||kind==='max'?(acc?60:90):kind==='time'?60:0}
function rxLabel(p,kind,n,t){if(kind==='block')return rxT(p);let s=p.replace(/^\d+/,String(n));if(t)s=/RPE/.test(s)?s.replace(/RPE \d+(?:–\d+)?/,'RPE '+t):s+' · RPE '+t;return rxT(s)}

function presc(str,red,dl,cap){let s=str;const m=s.match(/^(\d+)(\s(?:rondas))?\s×/);
if(m){const k=+m[1];const k2=dl?Math.max(1,Math.ceil(k/2)):(k>2?Math.max(2,k-red):k);s=s.replace(/^\d+/,String(k2))}

for(const p of pains){if(SUBS[p]&&SUBS[p][x]){x=SUBS[p][x];why={es:`Cambiado por tu molestia de ${T(PAIN[p]).toLowerCase()}`,en:`Swapped for your ${PAIN[p].en.toLowerCase()} niggle`};pain=true;break}}

function cd(x,y){const d=Math.abs(x-y);return Math.min(d,7-d)}
function pickDays(a,n,intense,order){
const days=a.days||[],spar=a.spar==null?-1:+a.spar;
const free=[0,1,2,3,4,5,6].filter(d=>!days.includes(d));
let pool=free.slice();
if(pool.length<n)pool=pool.concat(days.filter(d=>d!==spar));
const chosen=[];
while(chosen.length<n){let best=-1,bs=-99;
for(const d of pool){if(chosen.includes(d))continue;let s=chosen.length?Math.min(...chosen.map(c=>cd(c,d))):(spar>=0?cd(d,spar):3);if(!free.includes(d))s-=2;if(s>bs){bs=s;best=d}}
if(best<0)break;chosen.push(best)}
chosen.sort((x,y)=>x-y);
const as=chosen.map((d,i)=>({day:d,key:order[i],note:null}));
if(spar>=0){const before=(spar+6)%7;const bad=as.find(x=>x.day===before&&intense.includes(x.key));if(bad){const sw=as.find(x=>x!==bad&&!intense.includes(x.key));if(sw){const k=bad.key;bad.key=sw.key;sw.key=k}else bad.note={es:'Hazla a RPE 7 como máximo: mañana tienes sparring duro.',en:'Keep it to RPE 7 at most: hard sparring tomorrow.'}}}

function target(t,s0){if(s0==null||s0==='')return null;if(t.zero)return 0;if(t.pct)return Math.round(s0*(1+t.pct));if(t.sub)return Math.max(1,s0-t.sub);let ab=t.abs;if(t.id==='clases'){const q=S.a.q15;ab=q==='plus2'?2:q==='same'?0:1}if(t.id==='simwin'||t.id==='plana')return Math.min(5,s0+ab);return s0+ab}

function build(){
const a=S.a,G=S.goals,F=S.focus,sup=G.filter(g=>g!==F),d=diag(a),cap=d.age>=40;
const matN=(a.days||[]).length,n=a.time==='3x45'&&matN<=4?3:2,short=a.time==='2x30'||matN>=5;
const tpls=[];const take=(g,k)=>{if(!GTPL[g])return;for(const t of GTPL[g]){if(tpls.length>=n||k<=0)break;if(!tpls.includes(t)){tpls.push(t);k--}}};
let pref=GTPL[F]?F:null;
if(F==='engine'&&a.q15==='gas'&&!tpls.length){tpls.push('cond')}
if(pref)take(pref,n===3?2:1);for(const g of sup)take(g,1);if(pref)take(pref,3);for(const g of sup)take(g,3);
while(tpls.length<n)tpls.push(tpls.includes('full')?'aerob':'full');
const keys=['A','B','C'].slice(0,n),sessions=keys.map((k,i)=>({key:k,tpl:tpls[i]}));
const intense=sessions.filter(s=>TPL[s.tpl].intense).map(s=>s.key);
const assign=pickDays(a,n,intense,keys);
let redAll=(a.sleep==='<6'?1:0)+(matN>=5?1:0)+(a.stress==='alto'?1:0);const redAcc=cap?1:0;
const Ls=S.log?loadStats():null,spike=!!(Ls&&Ls.ratio!=null&&Ls.ratio>1.3);if(spike)redAll++;
/* modules: goals not covered by a session, then limiters */
const mc={};const addm=(m,w,src)=>{if(!MOD[m])return;mc[m]=mc[m]||{w:0,src:[]};mc[m].w+=w;if(!mc[m].src.includes(src))mc[m].src.push(src)};
const has=list=>tpls.some(t=>list.includes(t));
if(G.includes('injury')&&!has(['durab','mobcore']))addm('blindaje',3,'injury');
if(G.includes('engine')&&!has(['power','cond','strend'])){const q=F==='engine'?a.q15:null;addm(q==='pot'?'potencia':(q==='gas'||d.L.gas>0)?'gas':'potencia',3,'engine')}
if(d.items.some(i=>['montada','lateral'].includes(i.s)&&['peso','fuerza'].includes(i.lim)))addm('escapes',d.L.peso+d.L.fuerza+1,'limit');
if(d.L.agarre>0)addm('agarre',d.L.agarre,'limit');
if(d.L.mov>0&&!has(['mobcore']))addm('movilidad',d.L.mov,'limit');
if(d.L.gas>0&&!has(['cond','match','strend']))addm('gas',d.L.gas,'limit');
const mods=Object.keys(mc).sort((x,y)=>mc[y].w-mc[x].w).slice(0,2);
/* weekly extras: mental, video, recovery */
const extras=[];
if(G.includes('mind'))for(let i=0;i<(F==='mind'?4:2);i++)extras.push('ment');
else if(F==='comp')extras.push('ment');
if(G.includes('strategy'))for(let i=0;i<(F==='strategy'?2:1);i++)extras.push('vid');
if(G.includes('train')||G.includes('injury')||cap)extras.push('rec');
const busy=d=>(a.days||[]).includes(d)||assign.some(x=>x.day===d);
const place={};const putX=(type,pref)=>{for(const day of pref){const cur=place[day]||[];if(cur.includes(type))continue;place[day]=cur.concat(type);return}};
const freeD=[0,1,2,3,4,5,6].filter(x=>!busy(x)),noSc=[0,1,2,3,4,5,6].filter(x=>!assign.some(y=>y.day===x));
for(const t of extras){const order=t==='rec'?freeD.concat(noSc):t==='vid'?freeD.concat(noSc):noSc.concat(freeD);putX(t,order.length?order:[6])}
/* services by week */
const svc=[];
if(d.pains.length)svc.push({c:'fisio',w:1});
if(G.includes('injury')){svc.push({c:'fisio',w:4},{c:'fisio',w:8})}else if(cap||d.pains.length)svc.push({c:'fisio',w:6});
if(['cut2','cut5','unsure'].includes(a.wcut)){svc.push({c:'nutri',w:1},{c:'nutri',w:6})}else if(G.includes('comp'))svc.push({c:'nutri',w:2});
if(G.includes('mind'))for(const w of F==='mind'?[2,6,10]:[3,9])svc.push({c:'psico',w});
if((F==='engine'||F==='comp')&&a.place==='gym')svc.push({c:'fuerza',w:1});
const adj=[];
adj.push(L(`${matN} ${matN===1?'día':'días'} de tatami → ${n} sesiones de físico por semana${short?', en versión corta':''}`,`${matN} mat ${matN===1?'day':'days'} → ${n} strength sessions per week${short?', short version':''}`));
if(a.spar>=0)adj.push(L(`Sparring duro el ${DAYC_.es[a.spar].toLowerCase()} → nada intenso el día antes`,`Hard sparring on ${DAYC_.en[a.spar]} → nothing intense the day before`));
if(cap)adj.push(L(`${d.age} años → una serie menos en los accesorios y RPE máximo 8`,`${d.age} years old → one less set on accessories and RPE 8 max`));
if(a.sleep==='<6'||a.stress==='alto')adj.push(L('Poco sueño o estrés alto → un 20 % menos de volumen','Short sleep or high stress → 20% less volume'));
if(d.pains.length){let k=0;for(const as of assign)for(const it of TPL[sessions.find(s=>s.key===as.key).tpl].items)if(exName(it[0],a,d.pains)[2])k++;if(k)adj.push(L(`Molestia de ${d.pains.map(p=>PAIN[p].es.toLowerCase()).join(' y ')} → ${k} ${k===1?'ejercicio cambiado':'ejercicios cambiados'}`,`${d.pains.map(p=>PAIN[p].en).join(' and ')} niggle → ${k} ${k===1?'exercise swapped':'exercises swapped'}`))}
if(a.place==='casa')adj.push(L('Entrenas en casa → kettlebell, mancuernas y peso corporal','Training at home → kettlebell, dumbbells and bodyweight'));
for(const m of mods){const s=mc[m].src;adj.push(s.includes('limit')?L(`Lo que te frena → ${MOD[m].es}`,`What holds you back → ${MOD[m].en}`):L(`${T(GSHORT[s[0]])} sin sesión propia → ${MOD[m].es}`,`${T(GSHORT[s[0]])} without its own session → ${MOD[m].en}`))}
if(d.drills.length)adj.push(L(`Refuerzo técnico → 10 min de drills en solitario en cada sesión (nivel ${T(LEVL[d.level]).toLowerCase()})`,`Technique reinforcement → 10 min of solo drills in every session (${T(LEVL[d.level]).toLowerCase()} level)`));
if(spike)adj.push(L(`Últimos 7 días con un ${Math.round((Ls.ratio-1)*100)} % más de carga que tu media → una serie menos en cada ejercicio esta semana`,`Last 7 days ${Math.round((Ls.ratio-1)*100)}% above your average load → one less set per exercise this week`));
return {a,G,F,sup,d,cap,n,short,sessions,assign,intense,redAll,redAcc,mods,mc,place,extras,svc,adj,matN}}
function tplOf(b,key){return TPL[b.sessions.find(s=>s.key===key).tpl]}

const mrows=md?md.items.map(it=>{const [id,why]=exName(it[0],a,b.d.pains);return {id,why,acc:true,mod:true,p:presc(it[pk],red,ph.dl,cap)}}).filter(r=>!ids.has(r.id)):[];

const notes=[t.note?T(t.note):'',ph.dl&&!ph.taper?L('Semana de descarga: mitad de series y la misma carga.','Deload week: half the sets at the same load.'):'',ph.taper?L('Semana de competición: series cortas y nada nuevo. Llegas fresco.','Competition week: short sets and nothing new. Arrive fresh.'):'',b.short?L('Versión corta: los 4 primeros ejercicios.','Short version: the first 4 exercises.'):'',as.note?T(as.note):''].filter(Boolean);

function plannedPerWeek(b){return b.n+(b.a.days||[]).length+b.extras.length}
function progressStats(b){
const per=plannedPerWeek(b),total=per*12,start=S.start||iso(monOf(today()));
const ses=(S.log.ses||[]).filter(s=>s.date>=start).length,mat=(S.log.mat||[]).filter(m=>m.date>=start).length,ex=Object.keys(S.ex||{}).filter(k=>k.slice(0,10)>=start).length;

const weeksLeft=13-sw,fbScore=weeksLeft>0?fbSum/(5*weeksLeft):0;
const pct=Math.max(0,Math.min(100,Math.round(100*(0.7*done/(per*weeksLeft)+0.3*fbScore))));
return {pct,done,total:per*weeksLeft,due,adh:due?Math.min(100,Math.round(100*done/due)):null,fbN:fbw.length,fbAvg:fbw.length?fbSum/fbw.length:null,per}}

const CAN_EMBED=!/claude\.ai|claudeusercontent|anthropic|artifact/i.test(location.hostname||'')&&location.protocol!=='file:';
function ytId(u){const m=/[?&]v=([\w-]{11})/.exec(u||'');return m?m[1]:''}
function forYou(){if(!S.a)return [];const lose=S.a.lose||[],fv=favs(S.a);
return TECH.map(t=>({t,s:t.sit.filter(x=>lose.includes(x)).length*3+t.fav.filter(x=>fv.includes(x)).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.t)}
function whyFor(t){if(!S.a)return '';const lose=(S.a.lose||[]).filter(x=>t.sit.includes(x));if(lose.length)return L(`Para tu punto débil: ${T(SIT[lose[0]]).toLowerCase()}`,`For your weak spot: ${T(SIT[lose[0]]).toLowerCase()}`);const f=favs(S.a).filter(x=>t.fav.includes(x));return f.length?L(`De tu juego: ${T(FAV[f[0]]).split(':')[0].toLowerCase()}`,`From your game: ${T(FAV[f[0]]).split(':')[0].toLowerCase()}`):''}
function vBadge(t){return t.video.type==='pending'?`<span class="vb pend">${ic('Clapperboard')}${L('En grabación','Recording')}</span>`:`<span class="vb">${ic('Play')}${L('Vídeo','Video')}</span>`}
function techRow(t){const w=whyFor(t);return `<button class="trow" data-act="tec-open" data-v="${t.id}"><span class="pic sm t-${({drill:'sky',escape:'amber',guardia:'indigo',pase:'orange',derribo:'slate',sumision:'purple',mente:'emerald',control:'sky',defensa:'amber'})[t.cat]}">${ic(({drill:'Activity',escape:'ShieldCheck',guardia:'Shield',pase:'Zap',derribo:'Swords',sumision:'Target',mente:'Brain',control:'Trophy',defensa:'ShieldCheck'})[t.cat]||'Target')}</span><span class="tb"><span class="tt">${esc(T(t.n))}${altName(t)?` <small class="ten">${esc(altName(t))}</small>`:''}</span><span class="ts"><i class="bd l-${t.lvl}" title="${esc(T(TLVL[t.lvl]))}"></i>${esc(T(TCAT[t.cat]))}${w?' · '+esc(w):''}</span></span>${vBadge(t)}</button>`}
function videoBlock(t){const v=t.video;
if(v.type==='native')return `<video class="tvid" src="${esc(v.url)}" controls playsinline preload="metadata"${v.startSeconds?` data-start="${v.startSeconds}"`:''}></video>`;
if(v.type==='youtube'){const id=ytId(v.url),st=v.startSeconds||0;
 if(CAN_EMBED)return `<div class="tvid"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1${st?'&start='+st:''}" title="${esc(T(t.n))}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
 return `<div class="tvid tvph"><span class="tplay">${ic('Play')}</span><p class="tvt">${esc(T(t.n))}</p><p class="tvc">${esc(v.ch||'YouTube')}</p><p class="tvn">${L('Vista previa: el reproductor se incrusta en la app instalada. Aquí ábrelo aparte:','Preview: the player is embedded in the installed app. Open it separately here:')} <a href="${esc(v.url)}${st?'&t='+st+'s':''}" target="_blank" rel="noopener">${L('ver vídeo','watch video')} ${ic('ExternalLink')}</a></p></div>`}
return `<div class="tvid tvpend"><span class="tplay pend">${ic('Clapperboard')}</span><p class="tvt">${L('Vídeo propio en grabación','Our own video is being recorded')}</p><p class="tvn">${L('40 segundos, grabado en la academia. Mientras tanto, los puntos clave de abajo son todo lo que necesitas.','40 seconds, filmed at the academy. Meanwhile, the key points below are all you need.')}</p></div>`}
